[project]
name = "helpdesk-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "omkar3311", email = "omkarwaghmare3311@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.4",
    "langchain-google-genai>=4.3.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=4.2.0",
    "onnxruntime==1.23.2",
    "pypdf>=6.16.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "unstructured>=0.18.32",
]

[project.scripts]
helpdesk-agent = "helpdesk_agent.app.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
