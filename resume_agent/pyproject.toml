[project]
name = "resume-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "omkar3311", email = "omkarwaghmare3311@gmail.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "apify-client>=2.5.1",
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "huggingface-hub>=1.27.0",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.4",
    "langchain-google-genai>=4.3.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "tavily-python>=0.7.27",
]

[project.scripts]
resume-agent = "resume_agent.runner:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
